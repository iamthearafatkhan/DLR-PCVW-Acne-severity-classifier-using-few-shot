[project]
name = "dlr-pcvw-acne-classifier"
version = "1.0.0"
description = "DLR-PCVW: Acne Severity Classification"
requires-python = ">=3.10,<3.11"
dependencies = [
    "streamlit==1.28.1",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "numpy==1.24.3",
    "matplotlib==3.7.2",
    "Pillow==10.0.0",
    "requests==2.31.0",
    "protobuf==3.20.3",
    "packaging==23.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"